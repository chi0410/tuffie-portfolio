<main id="main">
  <!-- 1 專案標題區 -->
  <section class="cs-hero">
    <div class="wrap">
      <div class="cs-hero-grid">
        <div class="cs-hero-text rv">
          <h1 data-k="h1"></h1>
          <p class="cs-sum" data-k="sum"></p>
        </div>
        <dl class="cs-meta rv">
          <div><dt data-k="metaTimelineLabel"></dt><dd data-k="metaTimeline"></dd></div>
          <div><dt data-k="metaTeamLabel"></dt><dd data-k="metaTeam"></dd></div>
          <div><dt data-k="metaRoleLabel"></dt><dd data-k="metaRole"></dd></div>
        </dl>
        <div class="cs-hero-visual rv">
          <img class="cs-hero-img" src="/assets/hero/case01-hero.png" alt="" data-alt-k="heroAlt" fetchpriority="high">
        </div>
      </div>
      <hr class="cs-divider cs-hero-divider">
    </div>
  </section>

  <!-- 2 專案背景 -->
  <section class="cs-sec" id="background">
    <div class="wrap">
      <p class="cs-label rv" data-k="bgLabel"></p>
      <p class="cs-lead rv" data-k="bgLead"></p>
      <p class="cs-body rv" data-k="bgP1"></p>
      <p class="cs-body rv" data-k="bgP2"></p>
      <figure class="cs-figure cs-figure--bg rv">
        <picture>
          <source media="(max-width: 760px)" data-srcset-k="bgScenarioRwd" srcset="/assets/case-diagrams/scenario-comparison-rwd-tw.png">
          <img data-src-k="bgScenarioWeb" data-alt-k="bgScenarioAlt" src="/assets/case-diagrams/scenario-comparison-web-tw.png" alt="" loading="lazy">
        </picture>
      </figure>
      <p class="cs-body rv" data-k="bgP3"></p>
    </div>
  </section>

  <!-- 3 整合多方觀點 -->
  <section class="cs-sec" id="research">
    <div class="wrap">
      <p class="cs-label rv" data-k="resLabel"></p>
      <p class="cs-lead rv" data-k="resLead"></p>
      <p class="cs-body rv" data-k="resBody"></p>
      <!-- 六宮格矩陣：3 欄角色 × 2 列維度；第一列 B 底色卡（表層）、第二列玻璃卡（深入） -->
      <!-- web：3 欄角色 × 2 列維度；rwd：轉置成每個角色一排（角色／表層／深入），
           位置 class（pm-r1~3 角色、pm-d1~2 維度）供 rwd 明確配置格線 -->
      <div class="pm-grid rv">
        <div class="pm-corner" aria-hidden="true"></div>
        <div class="pm-colhead pm-r1"><span class="pm-ico" aria-hidden="true">🙋</span><span class="pm-rname" data-k="pmRole1"></span></div>
        <div class="pm-colhead pm-r2"><span class="pm-ico" aria-hidden="true">🎧</span><span class="pm-rname" data-k="pmRole2"></span></div>
        <div class="pm-colhead pm-r3"><span class="pm-ico" aria-hidden="true">⚙️</span><span class="pm-rname" data-k="pmRole3"></span></div>

        <div class="pm-rowhead pm-d1" data-k="pmDim1"></div>
        <div class="pm-cell pm-d1 pm-r1" data-k="pmD1R1"></div>
        <div class="pm-cell pm-d1 pm-r2" data-k="pmD1R2"></div>
        <div class="pm-cell pm-d1 pm-r3" data-k="pmD1R3"></div>

        <div class="pm-rowhead pm-d2" data-k="pmDim2"></div>
        <div class="pm-cell pm-cell--deep pm-d2 pm-r1" data-k="pmD2R1"></div>
        <div class="pm-cell pm-cell--deep pm-d2 pm-r2" data-k="pmD2R2"></div>
        <div class="pm-cell pm-cell--deep pm-d2 pm-r3" data-k="pmD2R3"></div>
      </div>
    </div>
  </section>

  <!-- 4 核心痛點歸納 -->
  <section class="cs-sec" id="problem">
    <div class="wrap">
      <p class="cs-label rv" data-k="probLabel"></p>
      <p class="cs-lead rv" data-k="probLead"></p>
      <p class="cs-body rv" data-k="probBody"></p>
      <div class="cs-trio">
        <div class="rv"><div class="num">01</div><h3 data-k="probT1"></h3><p data-k="probD1"></p></div>
        <div class="rv"><div class="num">02</div><h3 data-k="probT2"></h3><p data-k="probD2"></p></div>
        <div class="rv"><div class="num">03</div><h3 data-k="probT3"></h3><p data-k="probD3"></p></div>
      </div>
      <figure class="cs-figure cs-figure--flow rv">
        <picture>
          <source media="(max-width: 760px)" data-srcset-k="flowRwd" srcset="/assets/case-diagrams/flow-comparison-rwd-tw.png">
          <img data-src-k="flowWeb" data-alt-k="flowAlt" src="/assets/case-diagrams/flow-comparison-web-tw.png" alt="" loading="lazy">
        </picture>
      </figure>
      <!-- 互動區塊：把痛點收斂成一句大哉問。方框在上、小熊在下（web/rwd 同結構）；
           無外層底色卡，方框自帶玻璃底；三顆思考泡泡自舉手處往上飄、排成微倒 C，最大顆疊進方框 -->
      <div class="redefine rv">
        <p class="redefine-label" data-k="redefineLabel"></p>
        <div class="redefine-stage">
          <div class="redefine-box">
            <p class="redefine-q" data-k="redefineQ"></p>
          </div>
          <!-- 泡泡與小熊平行擺放：小熊容器由 injectIcons 以 innerHTML 注入 SVG，
               泡泡若放在裡面會被覆蓋，故置於外層 wrap -->
          <div class="redefine-bearwrap">
            <span class="rd-tb rd-tb1" aria-hidden="true"></span>
            <span class="rd-tb rd-tb2" aria-hidden="true"></span>
            <span class="rd-tb rd-tb3" aria-hidden="true"></span>
            <div class="redefine-bear" data-icon="peach-bearbear" aria-hidden="true"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- 5 優化目標與策略 -->
  <section class="cs-sec" id="strategy">
    <div class="wrap">
      <p class="cs-label rv" data-k="stratLabel"></p>
      <p class="cs-lead rv" data-k="stratLead"></p>
      <p class="cs-body rv" data-k="stratBody"></p>
      <div class="cs-trio cs-trio--strat">
        <div class="rv"><div class="cs-strat-icon" data-icon="strategy-flow" role="img" data-aria-k="stratT1"></div><h3 data-k="stratT1"></h3><p data-k="stratD1"></p></div>
        <div class="rv"><div class="cs-strat-icon" data-icon="strategy-integrate" role="img" data-aria-k="stratT2"></div><h3 data-k="stratT2"></h3><p data-k="stratD2"></p></div>
        <div class="rv"><div class="cs-strat-icon" data-icon="strategy-backend" role="img" data-aria-k="stratT3"></div><h3 data-k="stratT3"></h3><p data-k="stratD3"></p></div>
      </div>
    </div>
  </section>

  <!-- 6 優化成果 -->
  <section class="cs-sec" id="solution">
    <div class="wrap">
      <p class="cs-label rv" data-k="solLabel"></p>
      <p class="cs-lead rv" data-k="solLead"></p>
      <div class="cs-solution-slot rv">
        <div class="sol-blocks">
          <!-- 區塊 1：優化前/後，點擊硬切 -->
          <!-- data-hot-top/bottom：tooltip 觸發帶（圖頂往下 250px ～ 圖底往上 150px），帶外滑鼠移入不顯示 -->
          <button type="button" class="solution-toggle" data-sol-toggle data-block="1"
                  data-hot-top="250" data-hot-bottom="150"
                  data-tip-before="solB1TipToAfter" data-tip-after="solB1TipToBefore"
                  data-aria-before="solB1AriaBefore" data-aria-after="solB1AriaAfter">
            <img class="sol-img sol-before" data-src-k="solB1Before" src="/assets/case-diagrams/solution-base-1-before-tw.png" alt="" loading="lazy">
            <img class="sol-img sol-after" data-src-k="solB1After" src="/assets/case-diagrams/solution-base-1-after-tw.png" alt="" loading="lazy">
            <span class="sol-tip" aria-hidden="true"></span>
          </button>
          <!-- 區塊 2：固定 -->
          <img class="sol-img sol-block-static" data-src-k="solB2" data-alt-k="solB2Alt" src="/assets/case-diagrams/solution-base-2-tw.png" alt="" loading="lazy">
          <!-- 區塊 3：同步變化，點擊硬切 -->
          <button type="button" class="solution-toggle" data-sol-toggle data-block="3"
                  data-tip-before="solB3Tip" data-tip-after="solB3Tip"
                  data-aria-before="solB3AriaBefore" data-aria-after="solB3AriaAfter">
            <img class="sol-img sol-before" data-src-k="solB3Before" src="/assets/case-diagrams/solution-base-3-before-tw.png" alt="" loading="lazy">
            <img class="sol-img sol-after" data-src-k="solB3After" src="/assets/case-diagrams/solution-base-3-after-tw.png" alt="" loading="lazy">
            <span class="sol-tip" aria-hidden="true"></span>
          </button>
          <!-- 區塊 4：固定 -->
          <img class="sol-img sol-block-static" data-src-k="solB4" data-alt-k="solB4Alt" src="/assets/case-diagrams/solution-base-4-tw.png" alt="" loading="lazy">
        </div>
      </div>
    </div>
  </section>

  <!-- 7 重點總結 -->
  <section class="cs-sec" id="takeaways">
    <div class="wrap">
      <p class="cs-label rv" data-k="takeLabel"></p>
      <p class="cs-lead rv" data-k="takeP1"></p>
      <p class="cs-body rv" data-k="takeP2"></p>
      <div class="cs-trio cs-trio--card">
        <div class="rv"><div class="num">01</div><h3 data-k="takeT1"></h3><p data-k="takeD1"></p></div>
        <div class="rv"><div class="num">02</div><h3 data-k="takeT2"></h3><p data-k="takeD2"></p></div>
        <div class="rv"><div class="num">03</div><h3 data-k="takeT3"></h3><p data-k="takeD3"></p></div>
      </div>
    </div>
  </section>

  <!-- 8 Next Project -->
  <section class="cs-sec cs-next-sec">
    <div class="wrap">
      <hr class="cs-divider">
      <p class="sec-title cs-next-title">Next Project</p>
      <a class="card cs-next-card rv" href="/work-brand-narrative.html">
        <div class="cover"><picture><source srcset="/assets/covers/cover-2-brand-narrative.webp" type="image/webp"><img src="/assets/covers/cover-2-brand-narrative.png" alt="" loading="lazy"></picture></div>
        <div class="body">
          <div class="tags" data-k="w2meta"></div>
          <h3 data-k="w2t"></h3>
          <p class="carddesc" data-k="w2d"></p>
          <p class="cardmore">Read more <span class="arr">&rarr;</span></p>
        </div>
      </a>
    </div>
  </section>
</main>
