  <!-- 7 優化成果拆解 -->
  <section class="cs-sec" id="breakdown">

      <p class="cs-label rv" data-k="s7Label"></p>
      <p class="cs-body rv" data-k="s7Body"></p>
      <div class="cs-solution-slot">
        <div class="diagram-tint rv">
          <div class="flow" id="flow">
            <svg class="flow-wires" id="flowWires" aria-hidden="true"></svg>

            <!-- a：emoji + 標籤A -->
            <div class="flow-layer flow-layer--col">
              <div class="flow-emoji" aria-hidden="true">👩&zwj;💼</div>
              <div class="flow-tag" data-node="tagA" data-k="flowTagA"></div>
            </div>
            <div class="flow-gap-l"></div>

            <!-- b：桌機兩張並排；≤768 單張點擊切換 before/after -->
            <div class="flow-layer"><div class="flow-pair" data-node="bPair" data-pair="b">
              <img class="flow-img flow-pair-before" data-node="bL" data-src-k="flowBLeft" src="/assets/case-diagrams/case02-b-before-left-tw.png" alt="" loading="lazy">
              <img class="flow-img flow-pair-after" data-node="bR" data-src-k="flowBRight" src="/assets/case-diagrams/case02-b-after-right-tw.png" alt="" loading="lazy">
              <span class="flow-pair-tip" aria-hidden="true"></span>
            </div></div>
            <div class="flow-gap-m"></div>

            <!-- c：標籤C -->
            <div class="flow-layer"><div class="flow-tag" data-node="tagC" data-k="flowTagC"></div></div>
            <div class="flow-gap-l"></div>

            <!-- d：桌機兩張並排（右圖疊影片）；≤768 單張點擊切換，切到 after 才顯示影片 -->
            <div class="flow-layer"><div class="flow-pair" data-node="dPair" data-pair="d">
              <img class="flow-img flow-pair-before" data-node="dL" data-src-k="flowDLeft" src="/assets/case-diagrams/case02-d-before-left-tw.png" alt="" loading="lazy">
              <div class="flow-img-wrap flow-pair-after" data-node="dR">
                <img class="flow-img" data-src-k="flowDRight" src="/assets/case-diagrams/case02-d-after-right-tw.png" alt="" loading="lazy">
                <video class="flow-vid flow-vid--upper" data-src-k="flowVidUpper" src="/assets/case-diagrams/case02-d-after-right-video-upper-tw.mp4" autoplay loop muted playsinline aria-hidden="true"></video>
                <video class="flow-vid flow-vid--down" data-src-k="flowVidDown" src="/assets/case-diagrams/case02-d-after-right-video-down-tw.mp4" autoplay loop muted playsinline aria-hidden="true"></video>
              </div>
              <span class="flow-pair-tip" aria-hidden="true"></span>
            </div></div>
            <div class="flow-gap-l"></div>

            <!-- f：單張寬版置中；≤768 換 rwd 版（picture source 只載入對應版本）-->
            <div class="flow-layer"><picture>
              <source media="(max-width: 768px)" data-srcset-k="flowFRwd" srcset="/assets/case-diagrams/case02-f-rwd-tw.png">
              <img class="flow-img flow-img--wide" data-node="f" data-src-k="flowF" src="/assets/case-diagrams/case02-f-web-tw.png" alt="" loading="lazy">
            </picture></div>
            <div class="flow-gap-m"></div>

            <!-- g：標籤G -->
            <div class="flow-layer"><div class="flow-tag" data-node="tagG" data-k="flowTagG"></div></div>
            <div class="flow-gap-l"></div>

            <!-- h：桌機兩張並排；≤768 單張點擊切換 before/after -->
            <div class="flow-layer"><div class="flow-pair" data-node="hPair" data-pair="h">
              <img class="flow-img flow-pair-before" data-node="hL" data-src-k="flowHLeft" src="/assets/case-diagrams/case02-h-before-left-tw.png" alt="" loading="lazy">
              <img class="flow-img flow-pair-after" data-node="hR" data-src-k="flowHRight" src="/assets/case-diagrams/case02-h-after-right-tw.png" alt="" loading="lazy">
              <span class="flow-pair-tip" aria-hidden="true"></span>
            </div></div>
            <div class="flow-gap-m"></div>

            <!-- i：標籤I，對齊 h 右圖中心（用與並排圖相同的兩欄結構，標籤置右欄中央）-->
            <div class="flow-layer"><div class="flow-align-right">
              <div class="flow-align-spacer" aria-hidden="true"></div>
              <div class="flow-align-tagcol"><div class="flow-tag" data-node="tagI" data-k="flowTagI"></div></div>
            </div></div>
            <div class="flow-gap-l"></div>

            <!-- j：單張寬版置中；≤768 換 rwd 版 -->
            <div class="flow-layer"><picture>
              <source media="(max-width: 768px)" data-srcset-k="flowJRwd" srcset="/assets/case-diagrams/case02-j-rwd-tw.png">
